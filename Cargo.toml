[package]
name = "zotero-rdf"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
description = "A Rust library for parsing Zotero RDF/XML export files"
documentation = "https://docs.rs/zotero-rdf"
readme = "README.md"
repository = "https://github.com/spartajet/zotero-rdf"
license = "MIT"
keywords = ["bibliography", "parser", "rdf", "xml", "zotero"]
categories = ["encoding", "parser-implementations", "science"]
include = ["CHANGELOG.md", "Cargo.toml", "LICENSE", "README.md", "src/**/*.rs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Lazy static initialization
once_cell = "1.21"
# Core RDF data structures
oxrdf = "0.3"
oxrdfxml = "0.2"
# Regular expressions for preprocessing
regex = "1"
# Serialization support
serde = { version = "1.0", features = ["derive"] }
# Error handling
thiserror = "2"
# Structured logging
tracing = "0.1"
# URL encoding for IRI-safe characters
urlencoding = "2"

[dev-dependencies]
# JSON serialization for tests
serde_json = "1"
# Logging subscriber for tests
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
