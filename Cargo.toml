[package]
name = "zotero-rdf"
version = "0.1.0"
edition = "2024"

[dependencies]
# 核心数据结构
oxrdf = "0.2"
oxrdfxml = "0.1"
# 工具库
thiserror = "1.0"
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
# 日志
tracing = "0.1"

[dev-dependencies]
# 测试依赖
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
